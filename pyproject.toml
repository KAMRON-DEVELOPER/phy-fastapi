[project]
name = "phy-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.137.1",
    "langchain>=1.3.9",
    "openai>=2.42.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = ["basedpyright>=1.39.8", "black>=26.5.1", "isort>=8.0.1", "ruff>=0.15.17"]


[tool.basedpyright]
include = ["src", "main.py"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"
reportUnusedParameter = "warning"
reportUnusedVariable = "warning"
reportUnusedExpression = "warning"
reportUnusedCoroutine = "warning"
reportUnusedImport = "warning"

[tool.isort]
profile = "black"
line_length = 80
# extend_skip = ["some"]
include_trailing_comma = false

[tool.black]
line-length = 80
# extend-exclude = "some"

[tool.ruff]
line-length = 80
# extend-exclude = ["some"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001", "PYI036", "PYI034", "S110"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
